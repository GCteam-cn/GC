<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>共驰车队车位选择系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --purple-900: #1a0b2e;
    --purple-800: #2d1b4e;
    --purple-700: #3d2463;
    --purple-600: #5b3a8e;
    --purple-500: #7c4dff;
    --purple-400: #9d6fff;
    --purple-300: #c4a7ff;
    --purple-200: #e0d4ff;
    --purple-glow: rgba(124, 77, 255, 0.5);
    --text-light: #f0eaff;
    --text-muted: #b8a8d9;
    --green: #4ade80;
    --red: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--purple-900);
    color: var(--text-light);
    min-height: 100vh;
    line-height: 1.8;
  }
  header {
    padding: 32px 24px 16px;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }
  header h1 {
    font-size: 1.4rem;
    background: linear-gradient(135deg, var(--purple-300), var(--purple-500));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .back-link {
    color: var(--purple-300);
    text-decoration: none;
    font-size: 0.9rem;
    padding: 8px 18px;
    border-radius: 50px;
    border: 1px solid rgba(124, 77, 255, 0.4);
    transition: all 0.3s ease;
  }
  .back-link:hover { background: rgba(124, 77, 255, 0.15); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 24px 80px; }

  /* 活动头部 */
  .event-header {
    background: linear-gradient(145deg, var(--purple-800), var(--purple-900));
    border: 1px solid rgba(124, 77, 255, 0.3);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .event-header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--purple-500), var(--purple-300), var(--purple-500));
    background-size: 200% 100%;
    animation: slide 3s linear infinite;
  }
  @keyframes slide {
    from { background-position: 0 0; }
    to { background-position: 200% 0; }
  }
  .event-header h2 {
    font-size: 1.3rem;
    color: var(--purple-200);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .event-header h2 .badge {
    font-size: 0.7rem;
    padding: 3px 10px;
    border-radius: 50px;
    background: var(--green);
    color: #000;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .event-header .desc {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 6px;
  }
  .event-header .time {
    color: var(--text-muted);
    font-size: 0.8rem;
  }

  /* 我的车队提示条 */
  .my-team-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(124, 77, 255, 0.15));
    border: 1px solid var(--green);
    border-radius: 14px;
    margin-bottom: 24px;
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.25);
    flex-wrap: wrap;
  }
  .my-team-bar.show { display: flex; }
  .my-team-bar .info { color: var(--text-light); font-size: 0.95rem; }
  .my-team-bar .info strong { color: var(--green); font-size: 1.05rem; }
  .my-team-bar .spots-count {
    color: var(--purple-200);
    font-size: 0.9rem;
    margin-left: 8px;
  }
  .btn-revert-all {
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-revert-all:hover {
    background: var(--red);
    color: #fff;
    transform: translateY(-2px);
  }

  /* 表单 */
  .form-panel {
    background: linear-gradient(145deg, var(--purple-800), var(--purple-900));
    border: 1px solid rgba(124, 77, 255, 0.25);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 28px;
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 20px;
    align-items: end;
  }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid rgba(124, 77, 255, 0.3);
    background: rgba(26, 11, 46, 0.6);
    color: var(--text-light);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: all 0.3s ease;
  }
  .field input:focus {
    border-color: var(--purple-500);
    box-shadow: 0 0 0 3px rgba(124, 77, 255, 0.2);
  }
  .field input:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn {
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--purple-500), var(--purple-600));
    color: #fff;
    box-shadow: 0 4px 20px var(--purple-glow);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px var(--purple-glow);
  }
  .btn-ghost {
    background: transparent;
    color: var(--purple-300);
    border: 1px solid rgba(124, 77, 255, 0.4);
  }
  .btn-ghost:hover { background: rgba(124, 77, 255, 0.15); }

  /* 统计 */
  .stats-bar {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 24px;
    background: rgba(124, 77, 255, 0.08);
    border-radius: 14px;
    margin-bottom: 24px;
    border: 1px solid rgba(124, 77, 255, 0.15);
    font-size: 0.9rem;
    color: var(--text-muted);
  }
  .stat-item strong { color: var(--purple-200); }

  /* 路线区块 */
  .route-block {
    margin-bottom: 36px;
    background: rgba(124, 77, 255, 0.04);
    border: 1px solid rgba(124, 77, 255, 0.15);
    border-radius: 20px;
    padding: 24px;
  }
  .route-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .route-header h3 {
    font-size: 1.15rem;
    color: var(--purple-300);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .route-header .route-badge {
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 50px;
    background: rgba(124, 77, 255, 0.2);
    color: var(--purple-200);
    font-weight: 500;
  }
  .route-stats {
    color: var(--text-muted);
    font-size: 0.85rem;
  }
  .route-map {
    margin-bottom: 18px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(124, 77, 255, 0.25);
    background: var(--purple-800);
  }
  .route-map img {
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    display: block;
  }

  /* 车位网格 */
  .parking-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .parking-spot {
    position: relative;
    border-radius: 14px;
    border: 1px solid rgba(124, 77, 255, 0.3);
    background: rgba(124, 77, 255, 0.08);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    text-align: center;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .parking-spot:hover:not(.taken) {
    border-color: var(--purple-500);
    background: rgba(124, 77, 255, 0.2);
    transform: translateY(-4px);
    box-shadow: 0 8px 28px rgba(124, 77, 255, 0.35);
  }
  .parking-spot .spot-img {
    width: 100%;
    height: 90px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--purple-700);
  }
  .parking-spot .spot-num {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--purple-300);
    letter-spacing: 1px;
  }
  .parking-spot .spot-team {
    font-size: 0.78rem;
    color: var(--text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .parking-spot.taken {
    background: rgba(60, 40, 90, 0.5);
    border-color: rgba(124, 77, 255, 0.15);
    cursor: default;
    opacity: 0.8;
  }
  .parking-spot.taken .spot-num { color: #5a4a7a; }
  .parking-spot.mine {
    background: linear-gradient(145deg, rgba(74, 222, 128, 0.15), rgba(124, 77, 255, 0.15));
    border-color: var(--green);
    box-shadow: 0 0 24px rgba(74, 222, 128, 0.4);
    opacity: 1;
  }
  .parking-spot.mine .spot-num { color: var(--green); }
  .parking-spot.mine .spot-team { color: var(--green); }

  .parking-spot .revert-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(239, 68, 68, 0.85);
    border: none;
    color: #fff;
    font-size: 0.85rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    z-index: 2;
    font-family: inherit;
  }
  .parking-spot.mine .revert-btn { display: flex; }
  .parking-spot .revert-btn:hover { background: #ef4444; transform: scale(1.15); }

  .empty-hint {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-hint .icon {
    font-size: 3rem;
    opacity: 0.5;
    display: block;
    margin-bottom: 16px;
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
  }

  /* 模态框 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 5, 20, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal.open { display: flex; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-content {
    background: linear-gradient(145deg, var(--purple-800), var(--purple-900));
    border: 1px solid rgba(124, 77, 255, 0.4);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    animation: modalIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes modalIn {
    from { transform: scale(0.9) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-icon { font-size: 3rem; margin-bottom: 16px; }
  .modal-content h3 { color: var(--purple-300); margin-bottom: 12px; font-size: 1.2rem; }
  .modal-content p { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }
  .modal-content p strong { color: var(--purple-200); }
  .modal-btns { display: flex; gap: 12px; justify-content: center; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, var(--purple-500), var(--purple-600));
    color: #fff;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 0.95rem;
    box-shadow: 0 8px 32px var(--purple-glow);
    z-index: 99999;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }

  @media (max-width: 768px) {
    .form-panel { grid-template-columns: 1fr; }
    .parking-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .parking-spot .spot-img { height: 70px; }
    .route-block { padding: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>共驰车队车位选择系统</h1>
  <a href="../" class="back-link">← 返回主站</a>
</header>

<main>
  <div id="eventContainer">
    <div class="loading">加载中...</div>
  </div>
</main>

<!-- 选车位确认 -->
<div class="modal" id="confirmModal">
  <div class="modal-content">
    <div class="modal-icon">🅿️</div>
    <h3>确认占用该车位？</h3>
    <p id="confirmInfo">--</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('confirmModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmSelection()">确认占用</button>
    </div>
  </div>
</div>

<!-- 撤回全部 -->
<div class="modal" id="revertAllModal">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <h3>撤回全部车位？</h3>
    <p>你车队占用的 <strong id="revertAllCount">0</strong> 个车位将全部恢复可选。</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('revertAllModal')">取消</button>
      <button class="btn btn-primary" style="background:linear-gradient(135deg,#ef4444,#dc2626);" onclick="confirmRevertAll()">确认撤回全部</button>
    </div>
  </div>
</div>

<!-- 撤回单个 -->
<div class="modal" id="revertOneModal">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <h3>撤回该车位？</h3>
    <p>车位 <strong id="revertOneNum">--</strong> 将恢复可选。</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal('revertOneModal')">取消</button>
      <button class="btn btn-primary" style="background:linear-gradient(135deg,#ef4444,#dc2626);" onclick="confirmRevertOne()">确认撤回</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* =====================================================
     配置：替换成你自己的 Supabase 项目
     ===================================================== */
  const SUPABASE_URL = 'https://wjwhrmtivatvzqgrvjjc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_CHje6Szxcl27CoDMQ0LUtg_i5e5FiO0';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const MY_TEAM_KEY = 'gc_parking_my_team';
  const MY_SPOTS_KEY = 'gc_parking_my_spots';

  let currentEvent = null;
  let currentRoutes = [];
  let pendingSpot = null;
  let revertOneSpot = null;

  /* =====================================================
     加载最新活动
     ===================================================== */
  async function loadLatestEvent() {
    const { data: events, error } = await sb
      .from('events')
      .select('*')
      .eq('is_active', true)
      .order('created_at', { ascending: false })
      .limit(1);

    if (error) { console.error(error); showError('加载活动失败'); return; }
    if (!events || !events.length) { showEmpty('管理员尚未发布活动'); return; }

    currentEvent = events[0];
    await loadRoutesAndSpots(currentEvent.id);
    renderPage();
  }

  /* =====================================================
     加载路线和车位
     ===================================================== */
  async function loadRoutesAndSpots(eventId) {
    const { data: routes, error: routeErr } = await sb
      .from('routes')
      .select('*')
      .eq('event_id', eventId)
      .order('sort_order', { ascending: true })
      .order('created_at', { ascending: true });

    if (routeErr) { console.error(routeErr); return; }
    if (!routes || !routes.length) { currentRoutes = []; return; }

    const routeIds = routes.map(r => r.id);
    const { data: spots, error: spotErr } = await sb
      .from('parking_spots')
      .select('*')
      .in('route_id', routeIds)
      .order('spot_number', { ascending: true });

    if (spotErr) { console.error(spotErr); return; }

    currentRoutes = routes.map(route => ({
      ...route,
      spots: (spots || []).filter(s => s.route_id === route.id)
    }));
  }

  /* =====================================================
     渲染页面
     ===================================================== */
  function renderPage() {
    const container = document.getElementById('eventContainer');
    const myTeam = JSON.parse(localStorage.getItem(MY_TEAM_KEY) || 'null');

    if (!currentEvent) { showEmpty('管理员尚未发布活动'); return; }
    if (!currentRoutes.length) { showEmpty('本次活动暂无路线'); return; }

    let totalSpots = 0, freeSpots = 0, takenSpots = 0;
    currentRoutes.forEach(r => {
      r.spots.forEach(s => {
        totalSpots++;
        if (s.is_taken) takenSpots++; else freeSpots++;
      });
    });

    let html = '';

    // 活动头部
    const eventTime = new Date(currentEvent.created_at).toLocaleString('zh-CN');
    html += `
      <div class="event-header">
        <h2>🚛 ${escapeHtml(currentEvent.title)}<span class="badge">最新活动</span></h2>
        ${currentEvent.description ? `<div class="desc">${escapeHtml(currentEvent.description)}</div>` : ''}
        <div class="time">发布时间：${eventTime}</div>
      </div>
    `;

    // 我的车队提示条
    const mySpotsList = [];
    currentRoutes.forEach(r => {
      r.spots.forEach(s => {
        if (s.is_taken && myTeam && s.team_name === myTeam.team) {
          mySpotsList.push(s.spot_number);
        }
      });
    });
    const showMyBar = myTeam && mySpotsList.length > 0;

    html += `
      <div class="my-team-bar ${showMyBar ? 'show' : ''}" id="myTeamBar">
        <div class="info">
          ✅ 你的车队 <strong>${myTeam ? escapeHtml(myTeam.team) : '--'}</strong>
          <span class="spots-count">
            ${showMyBar ? `（已占 ${mySpotsList.length} 个车位：${mySpotsList.join('、')}）` : ''}
          </span>
        </div>
        <button class="btn-revert-all" onclick="openRevertAllModal()">撤回全部车位</button>
      </div>
    `;

    // 表单
    const disableForm = myTeam && mySpotsList.length > 0;
    html += `
      <div class="form-panel" id="formPanel" ${disableForm ? 'style="opacity:0.6;"' : ''}>
        <div class="field">
          <label>车队名称 *</label>
          <input type="text" id="teamInput" placeholder="请输入车队名称" maxlength="20"
                 value="${myTeam ? escapeHtml(myTeam.team) : ''}"
                 ${disableForm ? 'disabled' : ''}>
        </div>
        <div class="field">
          <label>联系方式 *</label>
          <input type="text" id="contactInput" placeholder="QQ 或手机号" maxlength="20"
                 value="${myTeam ? escapeHtml(myTeam.contact || '') : ''}"
                 ${disableForm ? 'disabled' : ''}>
        </div>
        <div>
          <button class="btn btn-primary" onclick="scrollToGrid()">开始选车位</button>
        </div>
      </div>
    `;

    // 统计
    html += `
      <div class="stats-bar">
        <div class="stat-item">可选：<strong>${freeSpots}</strong></div>
        <div class="stat-item">已占用：<strong>${takenSpots}</strong></div>
        <div class="stat-item">总计：<strong>${totalSpots}</strong></div>
      </div>
    `;

    // 路线
    currentRoutes.forEach((route, idx) => {
      const routeFree = route.spots.filter(s => !s.is_taken).length;
      const routeTaken = route.spots.filter(s => s.is_taken).length;

      html += `
        <div class="route-block" id="route-${route.id}">
          <div class="route-header">
            <h3>📍 ${escapeHtml(route.name)}<span class="route-badge">路线 ${idx + 1}</span></h3>
            <div class="route-stats">
              可选 ${routeFree} / 已占 ${routeTaken} / 共 ${route.spots.length}
            </div>
          </div>
      `;

      if (route.map_image_url) {
        html += `
          <div class="route-map">
            <img src="${route.map_image_url}" alt="${escapeHtml(route.name)}">
          </div>
        `;
      }

      if (!route.spots.length) {
        html += `<div class="empty-hint"><span class="icon">🅿️</span>该路线暂无车位</div>`;
      } else {
        html += `<div class="parking-grid">`;
        route.spots.forEach(spot => {
          const isMine = spot.is_taken && myTeam && spot.team_name === myTeam.team;
          const classes = ['parking-spot'];
          if (spot.is_taken) classes.push('taken');
          if (isMine) classes.push('mine');

          html += `<div class="${classes.join(' ')}" data-id="${spot.id}">`;
          if (isMine) {
            html += `<button class="revert-btn"
                      onclick="event.stopPropagation();openRevertOne('${spot.id}','${spot.spot_number}')"
                      title="撤回">×</button>`;
          }
          if (spot.image_url) {
            html += `<img src="${spot.image_url}" class="spot-img" alt="${spot.spot_number}">`;
          }
          html += `<div class="spot-num">${spot.spot_number}</div>`;
          html += `<div class="spot-team">${spot.is_taken ? escapeHtml(spot.team_name || '') : '可选'}</div>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
    });

    container.innerHTML = html;

    // 绑定点击
    currentRoutes.forEach(route => {
      route.spots.forEach(spot => {
        if (spot.is_taken) return;
        const el = container.querySelector(`[data-id="${spot.id}"]`);
        if (el) el.onclick = () => handleSpotClick(spot);
      });
    });
  }

  /* =====================================================
     点击车位
     ===================================================== */
  function handleSpotClick(spot) {
    const team = document.getElementById('teamInput').value.trim();
    const contact = document.getElementById('contactInput').value.trim();

    if (!team) {
      showToast('请先填写车队名称', 'error');
      document.getElementById('teamInput').focus();
      return;
    }
    if (!contact) {
      showToast('请先填写联系方式', 'error');
      document.getElementById('contactInput').focus();
      return;
    }

    pendingSpot = spot;
    document.getElementById('confirmInfo').innerHTML =
      `车位：<strong>${spot.spot_number}</strong><br>` +
      `车队：${escapeHtml(team)}`;
    openModal('confirmModal');
  }

  /* =====================================================
     确认选择
     ===================================================== */
  async function confirmSelection() {
    if (!pendingSpot) return;

    const team = document.getElementById('teamInput').value.trim();
    const contact = document.getElementById('contactInput').value.trim();

    const { data, error } = await sb
      .from('parking_spots')
      .update({
        is_taken: true,
        team_name: team,
        contact: contact,
        taken_at: new Date().toISOString()
      })
      .eq('id', pendingSpot.id)
      .eq('is_taken', false)
      .select();

    if (error) {
      showToast('提交失败：' + error.message, 'error');
      closeModal('confirmModal');
      return;
    }

    if (!data || !data.length) {
      showToast('手慢了，该车位已被抢', 'error');
      closeModal('confirmModal');
      await refresh();
      return;
    }

    localStorage.setItem(MY_TEAM_KEY, JSON.stringify({ team, contact }));
    let mySpots = JSON.parse(localStorage.getItem(MY_SPOTS_KEY) || '[]');
    if (!mySpots.includes(pendingSpot.spot_number)) {
      mySpots.push(pendingSpot.spot_number);
      localStorage.setItem(MY_SPOTS_KEY, JSON.stringify(mySpots));
    }

    showToast(`车位 ${pendingSpot.spot_number} 占用成功！`, 'success');
    closeModal('confirmModal');
    await refresh();
  }

  /* =====================================================
     撤回单个
     ===================================================== */
  function openRevertOne(id, number) {
    revertOneSpot = { id, number };
    document.getElementById('revertOneNum').textContent = number;
    openModal('revertOneModal');
  }

  async function confirmRevertOne() {
    if (!revertOneSpot) return;

    const { error } = await sb
      .from('parking_spots')
      .update({ is_taken: false, team_name: null, contact: null, taken_at: null })
      .eq('id', revertOneSpot.id)
      .eq('is_taken', true);

    if (error) {
      showToast('撤回失败：' + error.message, 'error');
      closeModal('revertOneModal');
      return;
    }

    let mySpots = JSON.parse(localStorage.getItem(MY_SPOTS_KEY) || '[]');
    mySpots = mySpots.filter(n => n !== revertOneSpot.number);
    if (mySpots.length) {
      localStorage.setItem(MY_SPOTS_KEY, JSON.stringify(mySpots));
    } else {
      localStorage.removeItem(MY_TEAM_KEY);
      localStorage.removeItem(MY_SPOTS_KEY);
    }

    showToast(`车位 ${revertOneSpot.number} 已撤回`, 'success');
    closeModal('revertOneModal');
    revertOneSpot = null;
    await refresh();
  }

  /* =====================================================
     撤回全部
     ===================================================== */
  function openRevertAllModal() {
    const myTeam = JSON.parse(localStorage.getItem(MY_TEAM_KEY) || 'null');
    if (!myTeam) { showToast('你还没有占用任何车位', 'error'); return; }

    let count = 0;
    currentRoutes.forEach(r => r.spots.forEach(s => {
      if (s.is_taken && s.team_name === myTeam.team) count++;
    }));
    if (!count) { showToast('你还没有占用任何车位', 'error'); return; }

    document.getElementById('revertAllCount').textContent = count;
    openModal('revertAllModal');
  }

  async function confirmRevertAll() {
    const myTeam = JSON.parse(localStorage.getItem(MY_TEAM_KEY) || 'null');
    if (!myTeam) return;

    const { error } = await sb
      .from('parking_spots')
      .update({ is_taken: false, team_name: null, contact: null, taken_at: null })
      .eq('is_taken', true)
      .eq('team_name', myTeam.team);

    if (error) {
      showToast('撤回失败：' + error.message, 'error');
      closeModal('revertAllModal');
      return;
    }

    localStorage.removeItem(MY_TEAM_KEY);
    localStorage.removeItem(MY_SPOTS_KEY);

    showToast('全部车位已撤回', 'success');
    closeModal('revertAllModal');
    await refresh();
  }

  /* =====================================================
     滚动
     ===================================================== */
  function scrollToGrid() {
    const team = document.getElementById('teamInput').value.trim();
    const contact = document.getElementById('contactInput').value.trim();
    if (!team || !contact) {
      showToast('请先填写车队名称和联系方式', 'error');
      return;
    }
    const firstRoute = document.querySelector('.route-block');
    if (firstRoute) firstRoute.scrollIntoView({ behavior: 'smooth', block: 'start' });
    showToast('请点击一个可选车位', 'success');
  }

  /* =====================================================
     刷新
     ===================================================== */
  async function refresh() {
    if (!currentEvent) return;
    await loadRoutesAndSpots(currentEvent.id);
    renderPage();
  }

  /* =====================================================
     实时订阅
     ===================================================== */
  function subscribeChanges() {
    sb.channel('parking-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'parking_spots' }, refresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'routes' }, refresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, loadLatestEvent)
      .subscribe();
  }

  /* =====================================================
     工具
     ===================================================== */
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    if (id === 'confirmModal') pendingSpot = null;
    if (id === 'revertOneModal') revertOneSpot = null;
  }
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
  function showEmpty(msg) {
    document.getElementById('eventContainer').innerHTML =
      `<div class="empty-hint"><span class="icon">🅿️</span>${msg}</div>`;
  }
  function showError(msg) {
    document.getElementById('eventContainer').innerHTML =
      `<div class="empty-hint"><span class="icon">⚠️</span>${msg}</div>`;
  }

  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast ' + type, 2600);
  }

  /* =====================================================
     初始化
     ===================================================== */
  window.addEventListener('load', async () => {
    await loadLatestEvent();
    subscribeChanges();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal('confirmModal');
      closeModal('revertAllModal');
      closeModal('revertOneModal');
    }
  });

  ['confirmModal', 'revertAllModal', 'revertOneModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
      if (e.target.id === id) closeModal(id);
    });
  });
</script>

</body>
</html>
